    }
    .form-group {

    }

      font-size: 13px;
      margin-bottom: 6px;

      background-color: #0b1120;
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }
    select:focus, textarea:focus, input:focus {
      border-color: var(--accent);
    }

      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:active {
      opacity: 0.85;
    }
